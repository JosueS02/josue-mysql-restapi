name: Deploy mysql-api

on:
  push:
    branches: ["master"]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env file with Aiven connection
        run: |
          echo "PORT=8080" >> .env
          echo "UPLOAD_PATH=./uploads" >> .env
          echo "MYSQL_HOST=${{ secrets.AIVEN_MYSQL_HOST }}" >> .env
          echo "MYSQL_USER=${{ secrets.AIVEN_MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.AIVEN_MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=defaultdb" >> .env
          echo "MYSQL_PORT=14234" >> .env
          cat .env

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/mysql-restapi:${{ github.sha }} .

      - name: Docker images
        run: docker images

      - name: Docker login to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USER }}/mysql-restapi:${{ github.sha }}
